<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propertio</title>
<link rel="icon" href="assets/favicon-light.ico" sizes="any">
<link rel="icon" href="assets/favicon-light.ico" sizes="any" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/favicon-dark.ico" sizes="any" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="topbar">
    <a class="brand" href="./" aria-label="Propertio">
      <span class="brand-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" aria-hidden="true"><g class="ln" stroke-width="40" stroke-linejoin="miter"><polygon fill="#E09132" points="55,805 48,290 640,38 640,125 345,295 347,802"/><polygon fill="#375EEB" points="432,35 1027,290 1020,805 730,800 735,295 432,165"/></g></svg></span>
      <span class="brand-name">Propertio</span>
    </a>
    <div class="langbar">
      <select id="langSel" aria-label="Language">
        <option value="uk">UA</option>
        <option value="pl">PL</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>
  <div class="hero">
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
  </div>
</header>
<nav class="secnav" id="secnav" aria-label="Sections">
    <a href="#mortBox" data-i18n="nav.mort"></a><a href="#s-add" data-i18n="nav.add"></a><a href="#s-overview" data-i18n="nav.overview"></a><a href="#s-compare" data-i18n="nav.compare"></a><a href="#s-all" data-i18n="nav.all"></a><a href="#s-own" data-i18n="nav.own"></a><a href="#s-verdicts" data-i18n="nav.verdicts"></a>
  </nav>


<div class="grid kpis" id="kpis"></div>

<details class="card" id="mortBox" open style="margin-top:20px">
  <summary><span data-i18n="mort.sum"></span>
    <label class="mort-toggle"><input type="checkbox" id="mortOn"> <span data-i18n="mort.on"></span></label></summary>
  <div class="mbody">
<div class="card settings" id="settings">
  <div class="field"><label for="dp" data-i18n="s.dp"></label>
    <select id="dp"></select></div>
  <div class="field rate"><label for="rateN" data-i18n="s.rate"></label>
    <div class="rate-row"><input type="range" id="rateR" min="2" max="12" step="0.05"><input type="number" id="rateN" min="0" max="30" step="0.05"></div></div>
  <div class="field"><label for="term" data-i18n="s.term"></label>
    <select id="term"></select></div>
  <div class="field keep"><label for="comm" data-i18n="s.comm"></label>
    <select id="comm"></select></div>
  <div class="field keep"><label for="czdef" data-i18n="s.czdef"></label>
    <select id="czdef"></select></div>
</div>

<div class="card settings" id="exPanel" style="position:static;margin-top:12px">
  <div class="field" style="min-width:100%"><b data-i18n="ex.title"></b> <span class="sub" data-i18n="ex.empty"></span></div>
  <div class="field"><label for="ex_extra" data-i18n="ex.extra"></label><input type="number" id="ex_extra" min="0" step="100" placeholder="0"></div>
  <div class="field"><label for="ex_lump" data-i18n="ex.lump"></label><input type="number" id="ex_lump" min="0" step="1000" placeholder="0"></div>
  <div class="field"><label for="ex_month" data-i18n="ex.lumpm"></label><input type="number" id="ex_month" min="1" max="360" value="12"></div>
  <div class="field"><label for="ex_mode" data-i18n="ex.mode"></label>
    <select id="ex_mode"><option value="term" data-i18n="ex.term"></option><option value="pay" data-i18n="ex.pay"></option></select></div>
  <div class="field"><label for="ex_fee" data-i18n="ex.fee"></label>
    <select id="ex_fee"><option value="0" data-i18n="ex.fee0"></option><option value="1">1%</option><option value="2">2%</option><option value="3">3%</option></select></div>
  <p class="hint" style="flex-basis:100%;margin:0" data-i18n="ex.hint"></p>
</div>

<details class="card" id="ownSettings" style="margin-top:12px">
  <summary data-i18n="own.sum"></summary>
  <p class="hint" data-i18n="own.hint"></p>
  <div class="tw"><table class="owntbl" id="ownTbl"></table></div>
</details>
  </div>
  <p class="hint mnote" data-i18n="mort.off"></p>
</details>

<h2 id="s-add" data-i18n="h.add"></h2>
<div class="card">
  <div class="urlrow">
    <input type="url" id="f_url" placeholder="https://www.otodom.pl/pl/oferta/... / https://www.morizon.pl/oferta/...">
    <button class="pbtn sec" id="btnFetch" type="button" data-i18n="f.fetch"></button>
  </div>
  <div class="msg" id="fmsg"></div>
  <div class="addform" style="margin-top:12px">
    <div class="field wide"><label for="f_name" data-i18n="f.name"></label><input type="text" id="f_name" data-i18n-ph="f.name.ph"></div>
    <div class="field"><label for="f_price" data-i18n="f.price"></label><input type="number" id="f_price" min="0" step="1000"></div>
    <div class="field"><label for="f_area" data-i18n="f.area"></label><input type="number" id="f_area" min="0" step="0.01"></div>
    <div class="field"><label for="f_rooms" data-i18n="f.rooms"></label><input type="text" id="f_rooms"></div>
    <div class="field"><label for="f_floor" data-i18n="f.floor"></label><input type="text" id="f_floor" data-i18n-ph="f.floor.ph"></div>
    <div class="field"><label for="f_year" data-i18n="f.year"></label><input type="text" id="f_year"></div>
    <div class="field"><label for="f_dist" data-i18n="f.dist"></label><input type="text" id="f_dist"></div>
    <div class="field"><label for="f_czynsz" data-i18n="f.cz"></label><input type="number" id="f_czynsz" min="0"></div>
    <div class="field"><label for="f_ready" data-i18n="f.cond"></label><select id="f_ready"><option value="1" data-i18n="f.cond.ready"></option><option value="0" data-i18n="f.cond.reno"></option></select></div>
    <div class="field"><label for="f_own" data-i18n="f.own"></label><select id="f_own"></select></div>
    <div class="field"><label for="f_agency" data-i18n="f.seller"></label><select id="f_agency"><option value="1" data-i18n="f.seller.agency"></option><option value="0" data-i18n="f.seller.owner"></option></select></div>
    <div class="field"><label for="f_rmin" data-i18n="f.rmin"></label><input type="number" id="f_rmin" min="0" step="5000" value="0"></div>
    <div class="field"><label for="f_rmax" data-i18n="f.rmax"></label><input type="number" id="f_rmax" min="0" step="5000" value="0"></div>
    <div class="field"><label for="f_ormin" data-i18n="f.ormin"></label><input type="number" id="f_ormin" min="0" step="100"></div>
    <div class="field"><label for="f_ormax" data-i18n="f.ormax"></label><input type="number" id="f_ormax" min="0" step="100"></div>
    <div class="field wide"><label for="f_feat" data-i18n="f.feat"></label><input type="text" id="f_feat"></div>
    <div class="wide"><button class="pbtn" id="btnAdd" type="button" data-i18n="f.add"></button>
      <span class="msg" id="amsg"></span></div>
  </div>
  <p class="hint" data-i18n-html="f.hint"></p>
</div>

<h2 id="s-overview" data-i18n="h.overview"></h2>
<div class="card">
  <div class="tabs" id="metricTabs"></div>
  <div class="bars" id="bars"></div>
  <p class="hint" data-i18n="bars.hint"></p>
</div>

<h2 id="s-compare" data-i18n="h.compare"></h2>
<div class="pickers">
  <div class="card picker A"><div class="sub" data-i18n="pick.a"></div><select id="selA"></select><div style="margin-top:6px"><button class="btn x" id="delA" data-i18n="pick.del"></button></div></div>
  <div class="card picker B"><div class="sub" data-i18n="pick.b"></div><select id="selB"></select><div style="margin-top:6px"><button class="btn x" id="delB" data-i18n="pick.del"></button></div></div>
</div>
<div class="card" style="padding:0"><div class="tw"><table class="cmp" id="cmp"></table></div></div>
<p class="hint" data-i18n="cmp.hint"></p>

<h2 id="s-all" data-i18n="h.all"></h2>
<div class="hint" id="hiddenBar" style="margin:-4px 0 8px"></div>
<div class="card" style="padding:0"><div class="tw"><table class="all" id="all"></table></div></div>

<h2 id="s-own" data-i18n="h.own"></h2>
<div class="grid own-grid" id="ownAnalysis"></div>

<h2 id="s-verdicts" data-i18n="h.verdicts"></h2>
<div class="grid verdicts" id="verdicts"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/i18n-core.js"></script>
<script src="js/flats.js"></script>
<script src="js/state.js"></script>
<script src="js/ownership.js"></script>
<script src="js/utils.js"></script>
<script src="js/mortgage.js"></script>
<script src="js/kpi.js"></script>
<script src="js/settings.js"></script>
<script src="js/bars.js"></script>
<script src="js/compare.js"></script>
<script src="js/table.js"></script>
<script src="js/add.js"></script>
<script src="js/own-analysis.js"></script>
<script src="js/app.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
